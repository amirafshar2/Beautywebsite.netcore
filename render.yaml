# Render Blueprint — https://render.com/docs/blueprint-spec
# Render dashboard → New → Blueprint → choose this GitHub repository.
services:
  - type: web
    name: beauty-by-negin
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter         # paid: needed for the disk below (on "free" all data is reset after every deploy/restart/spin-down)
    region: frankfurt
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: Site__InitialAdmin__UserName
        value: admin
      - key: Site__InitialAdmin__Password   # asked in the dashboard, never stored in Git
        sync: false
      - key: Site__InitialAdmin__DisplayName
        value: Admin
    # App_Data holds everything that changes: database, keys, backups and uploaded images/videos.
    # It survives deploys and restarts.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
